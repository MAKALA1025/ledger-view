<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>家計簿</title>
<style>
:root{
  --ink:#1e1e1e; --sub:#5a6470; --line:#d6dbe1; --line2:#e8ebef;
  --frame:#a0afc3; --blue:#1e5aa8; --link:#0066cc;
  --hover:#e5f3fb; --hover-b:#70c0e7;
  --sel:#cce8ff; --sel-b:#99d1ff;
  --sel-focus:linear-gradient(#dcebfc,#c1dcfc); --sel-focus-b:#7da2ce;
  --bar:linear-gradient(#fbfdff 0%,#e9f1fa 49%,#dbe7f5 50%,#e6eff9 100%);
  --cmd:linear-gradient(#f9fbfe 0%,#eaf1f9 49%,#dde8f5 50%,#e8f0f9 100%);
  --head:linear-gradient(#ffffff,#f1f3f6);
  --red:#c0392b; --green:#2a7d2e;
  --side:220px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff;color:var(--ink);
  font:13px/1.5 "Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Segoe UI",Meiryo,sans-serif;
  -webkit-text-size-adjust:100%}
.num{font-variant-numeric:tabular-nums}
.serif,.title h1,.group>.gh b{font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho",serif}
button{font:inherit;color:inherit}
a{color:var(--link);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}

/* ---- 枠 ---- */
.app{display:grid;grid-template-columns:var(--side) 1fr;grid-template-rows:auto auto auto 1fr auto;height:100vh;height:100dvh}
.titlebar{grid-column:1/3;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:3px 10px;
  padding-top:calc(env(safe-area-inset-top) + 3px);color:#1e395b;font-size:12px;white-space:nowrap;overflow:hidden;
  background:linear-gradient(#dbe8f6 0%,#c9dcf2 50%,#bcd3ee 50%,#c8dbf1 100%);border-bottom:1px solid #8fa8c8}
.titlebar b{font-weight:600;letter-spacing:.04em}
.titlebar .ver{color:#38557a;font-variant-numeric:tabular-nums}
.top{grid-column:1/3;display:flex;align-items:center;gap:10px;padding:6px 10px;
  background:var(--bar);border-bottom:1px solid var(--frame)}
.crumb{flex:1;display:flex;align-items:center;min-width:0;height:26px;padding:0 8px;background:#fff;
  border:1px solid #8e9aab;box-shadow:inset 0 1px 1px rgba(0,0,0,.08);white-space:nowrap;overflow:hidden}
.crumb span{color:var(--sub)} .crumb b{font-weight:normal}
.crumb .sep{margin:0 6px;color:#8a96a6}
.search{width:220px;height:26px;padding:0 8px;border:1px solid #8e9aab;background:#fff;font:inherit;
  box-shadow:inset 0 1px 1px rgba(0,0,0,.08);border-radius:0}
.search:focus{outline:1px solid #3c7fb1;border-color:#3c7fb1}
.cmd{grid-column:1/3;display:flex;gap:2px;padding:3px 6px;background:var(--cmd);border-bottom:1px solid #c2cfdf}
.cmd button{border:1px solid transparent;background:none;padding:3px 10px;cursor:pointer;border-radius:2px}
.cmd button:hover{background:linear-gradient(#fdfeff,#e2eefa);border-color:#9bbad9}
.cmd button:active{background:linear-gradient(#d7e5f4,#e4eef9);border-color:#7a9cc2}
.cmd button:disabled{color:#a0a6ad;background:none;border-color:transparent;cursor:default}
.cmd .grow{flex:1}
.menu{display:none}

/* ---- サイドバー ---- */
.side{overflow:auto;border-right:1px solid var(--line);background:#fff;padding:6px 0}
.side h3{margin:10px 12px 4px;font-size:12px;font-weight:normal;color:var(--blue)}
.node{display:flex;justify-content:space-between;gap:8px;margin:0 4px;padding:3px 8px 3px 22px;
  border:1px solid transparent;cursor:pointer;border-radius:2px;white-space:nowrap}
.node.top1{padding-left:10px}
.node:hover{background:var(--hover);border-color:var(--hover-b)}
.node.on{background:var(--sel-focus);border-color:var(--sel-focus-b)}
.node .v{color:var(--sub)}
.node .v.over{color:var(--red)}

/* ---- 本体 ---- */
.main{overflow:auto;min-width:0}
.pad{padding:14px 18px 24px}
.title{display:flex;align-items:baseline;gap:12px;margin:0 0 10px;flex-wrap:wrap}
.title h1{margin:0;font-size:22px;font-weight:600;color:var(--blue);letter-spacing:.02em}
.title .sub{color:var(--sub)}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);margin-bottom:16px}
.stat{padding:8px 12px;border-right:1px solid var(--line2);min-width:0}
.stat:last-child{border-right:0}
.stat .k{color:var(--sub);font-size:12px}
.stat .v{font-size:20px;white-space:nowrap}
.stat .v.small{font-size:16px}
.stat .inc{font-size:13px;margin-left:14px;vertical-align:2px}
.stat .inc.sub2{color:var(--sub)}
/* 横スクロールしても1列目（カテゴリ）は動かない */
.sticky1 th:first-child,.sticky1 td:first-child{position:sticky;left:0;z-index:2;background:#fff;box-shadow:1px 0 0 var(--line)}
.sticky1 th:first-child{background:var(--head);z-index:3}
.sticky1 tr.total td:first-child{background:#f7f9fb}
.sticky1 tbody tr:hover td:first-child{background:var(--hover)}
/* 編集画面 */
.ecols{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,400px);gap:18px;align-items:start}
.elist{max-height:calc(100vh - 250px);overflow:auto;border:1px solid var(--line)}
.panel{border:1px solid #9fb2cb;background:#fff;margin-bottom:16px}
.panel .ph{padding:5px 10px;color:#1e395b;background:linear-gradient(#f4f8fd 0%,#e3edf9 50%,#d8e6f6 50%,#e1ecf8 100%);border-bottom:1px solid #b9c9de}
.panel .pb{padding:12px 14px}
.panel pre{margin:8px 0;padding:8px 10px;background:#f5f7fa;border:1px solid var(--line);font:12px/1.5 Menlo,Consolas,monospace;white-space:pre-wrap}
.form{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center}
.form label{white-space:nowrap;color:#333}
.form input,.form select,.ctl select,.ctl input[type=text]{height:26px;min-width:0;width:100%;border:1px solid #abadb3;border-radius:0;padding:0 6px;font:inherit;background:#fff}
.form input[readonly]{background:#f3f3f3;color:#555}
.form input:focus,.form select:focus{outline:none;border-color:#3c7fb1;box-shadow:0 0 0 1px #c5dcf0}
.form .hint{grid-column:2;color:var(--sub);font-size:12px;margin-top:-4px}
.form .full{grid-column:1/3}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.ctl select{width:auto}
.small{font-size:12px}
input.bud{height:24px;width:110px;text-align:right;border:1px solid #abadb3;border-radius:0;padding:0 6px;font:inherit}
.over{color:var(--red)} .ok{color:var(--green)}

.cols{display:grid;grid-template-columns:minmax(230px,270px) minmax(0,1fr);gap:18px;align-items:start}
.group{margin-bottom:16px;min-width:0}
.group>.gh{display:flex;justify-content:space-between;align-items:baseline;
  color:var(--blue);margin:0 0 4px;padding-bottom:3px;border-bottom:1px solid #c5d3e6}
.group>.gh b{font-weight:600;font-size:15px}

/* ---- 表（詳細表示） ---- */
table{border-collapse:collapse;width:100%}
th{background:var(--head);font-weight:normal;color:#3c4a5c;text-align:left;padding:4px 8px;
  border-bottom:1px solid var(--line);border-right:1px solid var(--line2);white-space:nowrap;
  position:sticky;top:0;z-index:1;user-select:none}
th.sort{cursor:pointer} th.sort:hover{background:linear-gradient(#f3f9fe,#dfeefb)}
th .arr{color:#6b7d93;font-size:10px;margin-left:4px}
td{padding:3px 8px;border-bottom:1px solid #f0f2f5;white-space:nowrap}
td.r,th.r{text-align:right}
td.wrap{white-space:normal}
td.place{max-width:200px;overflow:hidden;text-overflow:ellipsis}
td.memo{max-width:150px;overflow:hidden;text-overflow:ellipsis}
tbody tr:hover td{background:var(--hover)}
tbody tr.on td{background:var(--sel)}
tr.click{cursor:pointer}
tr.total td{border-top:1px solid var(--line);border-bottom:0;font-weight:bold;background:#f7f9fb}
tr.daybreak td{border-top:1px solid #dfe4ea}
.muted{color:var(--sub)}
.scrollx{overflow-x:auto}
.empty{color:var(--sub);padding:20px 0}

/* ---- 月別グラフ（これ1つだけ） ---- */
.chart{border:1px solid var(--line);padding:10px 10px 4px;margin-bottom:16px}
.chart svg{display:block;width:100%;max-width:720px;height:auto}

/* ---- ステータスバー ---- */
.status{grid-column:1/3;display:flex;gap:18px;padding:3px 10px;background:var(--bar);
  border-top:1px solid var(--frame);color:#2f3d4f;white-space:nowrap;overflow:hidden}
.status .grow{flex:1}

/* ---- 狭い画面 ---- */

/* ---- ツールボタン・右クリックメニュー・ダイアログ ---- */
.tool{height:26px;border:1px solid transparent;background:none;padding:0 10px;cursor:pointer;border-radius:2px;white-space:nowrap}
.tool:hover{background:linear-gradient(#fdfeff,#e2eefa);border-color:#9bbad9}
.ctx{position:fixed;z-index:50;min-width:230px;padding:2px;border:1px solid #979797;
  background:linear-gradient(90deg,#f1f1f1 27px,#e2e3e3 27px,#e2e3e3 28px,#fff 28px,#fff 29px,#f0f0f0 29px);
  box-shadow:2px 2px 3px rgba(0,0,0,.3);user-select:none}
.ctx .it{position:relative;padding:4px 28px 4px 34px;border:1px solid transparent;border-radius:2px;cursor:default;white-space:nowrap}
.ctx .it:hover,.ctx .it.hot{background:linear-gradient(#f3f8fd,#e1ecf9);border-color:#aecff7}
.ctx .it.dis{color:#8d8d8d}.ctx .it.dis:hover{background:none;border-color:transparent}
.ctx .sep{height:0;margin:3px 2px 3px 31px;border-top:1px solid #e0e0e0;border-bottom:1px solid #fff}
.ctx .hd{padding:4px 10px 4px 34px;color:var(--sub);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px}
.dlg-back{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center}
.dlg{width:min(440px,calc(100vw - 20px));max-height:calc(100vh - 20px);display:flex;flex-direction:column;background:#fff;
  border:1px solid #6d7f96;box-shadow:0 5px 20px rgba(0,0,0,.35)}
.dlg .tb{display:flex;align-items:center;justify-content:space-between;padding:5px 6px 5px 12px;color:#1e395b;
  background:linear-gradient(#e9f1fb 0%,#d6e5f6 50%,#c7dbf2 50%,#d3e3f6 100%);border-bottom:1px solid #9fb2cb}
.dlg .x{width:42px;height:20px;border:1px solid #8a5b5b;border-radius:2px;color:#fff;cursor:pointer;
  background:linear-gradient(#e8a493 0%,#d9715b 50%,#c74a2e 50%,#d66b4f 100%);font-size:13px;line-height:1}
.dlg .x:hover{background:linear-gradient(#f3b7a8 0%,#e8846c 50%,#de5a39 50%,#ec8566 100%)}
.dlg .bd{padding:14px 16px;overflow:auto;display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center}
.dlg .bd .full{grid-column:1/3}
.dlg label{color:#333;white-space:nowrap}
.dlg input,.dlg select{height:26px;min-width:0;width:100%;border:1px solid #abadb3;border-radius:0;padding:0 6px;font:inherit;background:#fff}
.dlg input:focus,.dlg select:focus{outline:none;border-color:#3c7fb1;box-shadow:0 0 0 1px #c5dcf0}
.dlg .hint{grid-column:2;color:var(--sub);font-size:12px;margin-top:-4px}
.dlg .ft{display:flex;justify-content:flex-end;gap:8px;padding:10px 14px;background:#f0f0f0;border-top:1px solid #dfdfdf}
.btn{min-width:84px;height:26px;padding:0 12px;border:1px solid #707070;border-radius:2px;cursor:pointer;
  background:linear-gradient(#f2f2f2 0%,#ebebeb 50%,#dddddd 50%,#cfcfcf 100%)}
.btn:hover{border-color:#3c7fb1;background:linear-gradient(#eaf6fd 0%,#d9f0fc 50%,#bee6fd 50%,#a7d9f5 100%)}
.btn:active{background:linear-gradient(#e5f4fc 0%,#c4e5f6 50%,#98d1ef 50%,#68b3db 100%)}
.btn.def{border-color:#3c7fb1;box-shadow:inset 0 0 0 1px #c5e5fa}
.btn:disabled{color:#9a9a9a;border-color:#adb2b5;background:#f4f4f4;cursor:default}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.kv dt{color:var(--sub)} .kv dd{margin:0;word-break:break-all}
.toast{position:fixed;right:12px;bottom:34px;z-index:70;max-width:min(420px,calc(100vw - 24px));padding:6px 10px;
  background:#ffffe1;border:1px solid #767676;box-shadow:2px 2px 3px rgba(0,0,0,.2);transition:opacity .3s}
tr.tx{cursor:default}

@media (max-width:1100px){
  .cols{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat:nth-child(2n){border-right:0}
  .stat:nth-child(n+3){border-top:1px solid var(--line2)}
  .ecols{grid-template-columns:1fr}
  .elist{max-height:50vh}
}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .top,.cmd,.status,.titlebar{grid-column:1}
  .top{padding:6px 8px}
  .crumb{display:none}
  .search{flex:1;width:auto;height:32px;font-size:16px}
  .menu{display:block}
  .cmd button{padding:6px 10px}
  .side{position:fixed;z-index:20;top:0;bottom:0;left:0;width:78vw;max-width:300px;
    transform:translateX(-100%);transition:transform .18s ease;box-shadow:2px 0 8px rgba(0,0,0,.25);
    padding-top:calc(env(safe-area-inset-top) + 6px)}
  .side.open{transform:none}
  .shade{position:fixed;inset:0;z-index:19;background:rgba(0,0,0,.25);display:none}
  .shade.open{display:block}
  .node{padding-top:7px;padding-bottom:7px}
  .pad{padding:12px 12px 20px}
  .stat .v{font-size:18px}
  .stat .inc{display:block;margin:0;font-size:12px}
  .form{grid-template-columns:1fr}
  .form .hint{grid-column:1}
  .form input,.form select{height:36px;font-size:16px}
  .opt{display:none}
  td{padding:6px 6px} th{padding:5px 6px}
  td.place{max-width:36vw;overflow:hidden;text-overflow:ellipsis}
  .wd{display:none}
  .status{padding-bottom:calc(env(safe-area-inset-bottom) + 3px)}

  .tool{height:32px}
  #gear .lbl{display:none}
  .ctx.sheet{left:0!important;right:0;top:auto!important;bottom:0;min-width:0;max-height:75vh;overflow:auto;
    padding:4px 4px calc(env(safe-area-inset-bottom) + 4px);background:#f0f0f0;border-width:1px 0 0}
  .ctx.sheet .it{padding:11px 28px 11px 36px}
  .dlg-back{align-items:flex-end}
  .dlg{width:100vw;max-height:88vh;border-width:1px 0 0}
  .dlg .bd{grid-template-columns:1fr}
  .dlg .hint{grid-column:1}
  .dlg input,.dlg select{height:36px;font-size:16px}
  .dlg .ft{padding-bottom:calc(env(safe-area-inset-bottom) + 10px)}
  .btn{height:36px}
}
@media (min-width:761px){.shade{display:none!important}}
</style>
</head>

  <div class="titlebar"><b>家計簿</b><span class="ver">Ver 1.5.0　2026/11/25 00:49 更新</span></div>

    <div class="crumb" id="crumb"></div>

  <nav class="side" id="side"></nav>
  <div class="shade" id="shade"></div>
  <main class="main" id="main"></main>

</div>

function start(D0){
let D=D0;
const $=id=>document.getElementById(id);
const yen=n=>(n<0?"−":"")+"¥"+Math.abs(Math.round(n)).toLocaleString("ja-JP");
const num=n=>n?Math.round(n).toLocaleString("ja-JP"):"";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CATS=[...D.categories,"未分類"];
const isExp=t=>t.kind==="expense";
let months=[],mTotal={};
function prep(){
  months=[...new Set(D.txns.filter(t=>t.date&&(t.kind==="expense"||t.kind==="income")).map(t=>t.date.slice(0,7)))].sort();
  mTotal={};D.txns.filter(isExp).forEach(t=>{const m=t.date.slice(0,7);mTotal[m]=(mTotal[m]||0)+t.amount});
}
prep();
const budget=m=>D.budget[m]??D.budget.default??0;
const mLabel=m=>`${+m.slice(5)}月`;
const fy=()=>{const m=months[0];return +m.slice(5)>=4?+m.slice(0,4):+m.slice(0,4)-1};
const WD="日月火水木金土";

let S={view:"month",month:months.at(-1),cat:null,q:"",sort:{k:"date",d:-1},es:"tx",em:months.at(-1),eSel:null,eUnk:false,eRule:null};
try{const s=JSON.parse(localStorage.getItem("kakeibo.v2")||"{}");
  if(months.includes(s.month))S.month=s.month; if(["month","year","check"].includes(s.view))S.view=s.view;
  if(s.sort)S.sort=s.sort}catch(e){}
const save=()=>{try{localStorage.setItem("kakeibo.v2",JSON.stringify({month:S.month,view:S.view==="edit"?"month":S.view,sort:S.sort}))}catch(e){}};

function side(){
  if(S.view==="edit")return editSide();
  const years={};months.forEach(m=>(years[m.slice(0,4)]??=[]).push(m));
  let h=`<h3>集計</h3>
    <div class="node top1 ${S.view==="year"?"on":""}" data-act="view" data-v="year"><span>年度集計</span></div>
    <div class="node top1 ${S.view==="check"?"on":""}" data-act="view" data-v="check"><span>データ検証</span>${unk()?`<span class="v over">${unk()}</span>`:""}</div>`;
  for(const y of Object.keys(years).reverse()){
    h+=`<h3>${y}年</h3>`;
    for(const m of [...years[y]].reverse()){
      const v=mTotal[m]||0;
      h+=`<div class="node ${S.view==="month"&&S.month===m?"on":""}" data-act="month" data-m="${m}">
        <span>${mLabel(m)}</span><span class="v num ${v>budget(m)?"over":""}">${num(v)}</span></div>`;
    }
  }
  $("side").innerHTML=h;
}
const unk=()=>D.txns.filter(t=>t.category==="未分類"&&isExp(t)).length;

function crumb(){
  const parts=["家計簿"];
  if(S.view==="month")parts.push(`${S.month.slice(0,4)}年`,mLabel(S.month));
  if(S.view==="year")parts.push("年度集計");
  if(S.view==="check")parts.push("データ検証");
  if(S.view==="edit")parts.push("編集",(ESEC.find(x=>x[0]===S.es)||[])[1]||"");
  if(S.cat)parts.push(S.cat);
  $("crumb").innerHTML=parts.map((p,i)=>i<parts.length-1?`<span>${esc(p)}</span><span class="sep">›</span>`:`<b>${esc(p)}</b>`).join("");
}

function cmd(){
  const i=months.indexOf(S.month);
  let h=`<button class="menu" data-act="drawer">☰ 一覧</button>`;
  if(S.view==="edit")h+=`<button data-act="view" data-v="month">◀ 閲覧画面に戻る</button>`;
  if(S.view==="month"){
    h+=`<button data-act="month" data-m="${months[i-1]||""}" ${i<=0?"disabled":""}>◀ 前の月</button>
        <button data-act="month" data-m="${months[i+1]||""}" ${i>=months.length-1?"disabled":""}>次の月 ▶</button>`;
    if(S.cat)h+=`<button data-act="cat" data-c="">絞り込みを解除</button>`;
  }
  h+=`<span class="grow"></span>`;
  $("cmd").innerHTML=h;
}

function sortRows(rows){
  const {k,d}=S.sort;
  const key=t=>k==="date"?t.date+" "+(t.time||"00:00"):k==="amount"?t.amount:String(t[k]??"");
  return rows.sort((a,b)=>{const x=key(a),y=key(b);return (x<y?-1:x>y?1:0)*d});
}
const th=(k,label,cls="")=>{
  const on=S.sort.k===k;
  return `<th class="sort ${cls}" data-act="sort" data-k="${k}">${label}${on?`<span class="arr">${S.sort.d>0?"▲":"▼"}</span>`:""}</th>`;
};
const match=t=>{const q=S.q.trim().toLowerCase();return !q||[t.place,t.memo,t.raw,t.category,t.payment,t.note].join(" ").toLowerCase().includes(q)};

function txTable(rows,{showMonth=false}={}){
  if(!rows.length)return `<div class="empty">該当する取引はありません</div>`;
  let h=`<div class="scrollx"><table><thead><tr>
    ${th("date","日付")}${th("time","時刻","opt")}${th("place","場所")}${th("memo","内容","opt")}
    ${th("category","カテゴリ")}${th("payment","決済","opt")}${th("amount","金額","r")}</tr></thead><tbody>`;
  let prev="";
  for(const t of rows){
    const d=new Date(t.date+"T00:00");
    const brk=S.sort.k==="date"&&prev&&prev!==t.date?"daybreak":"";prev=t.date;
    const memo=[t.memo,t.count>1?`×${t.count}`:""].filter(Boolean).join(" ");
    h+=`<tr class="tx ${brk} ${S.selId===t.id?"on":""}" data-id="${t.id}" title="${esc(t.raw||t.place)}${t.note?" / "+esc(t.note):""}">
      <td class="num">${showMonth?(d.getMonth()+1)+"/":""}${d.getDate()}日<span class="muted wd"> (${WD[d.getDay()]})</span></td>
      <td class="num opt muted">${esc(t.time)}</td>
      <td class="place">${esc(t.place)}</td>
      <td class="opt muted memo">${esc(memo)}</td>
      <td class="${t.category==="未分類"?"over":t.kind==="income"?"ok":""}">${esc(t.category)}</td>
      <td class="opt muted" ${t.via?`title="${esc(t.via)}"`:""}>${esc(t.payment)}</td>
      <td class="r num ${t.amount<0?"ok":""}">${t.kind==="income"?"+"+yen(-t.amount):yen(t.amount)}</td></tr>`;
  }
  return h+`</tbody></table></div>`;
}

function monthView(){
  const m=S.month, T=D.txns.filter(t=>t.date.startsWith(m));
  const E=T.filter(isExp), total=E.reduce((a,t)=>a+t.amount,0), b=budget(m), left=b-total;
  const income=T.filter(t=>t.kind==="income").reduce((a,t)=>a-t.amount,0);
  const i=months.indexOf(m), prev=i>0?mTotal[months[i-1]]||0:null;
  // 日割り予算: 今月なら残り予算を残り日数で割る。過去の月なら日平均
  const now=new Date(), y=+m.slice(0,4), mo=+m.slice(5), dim=new Date(y,mo,0).getDate();
  const isCur=now.getFullYear()===y&&now.getMonth()+1===mo;
  const daysLeft=isCur?dim-now.getDate()+1:0;
  const perDay=isCur?{k:`日割り予算（残り${daysLeft}日）`,v:left>0?yen(left/daysLeft):"予算超過",cls:left>0?"":"over"}
                    :{k:"日平均",v:yen(total/dim),cls:""};
  const by={};E.forEach(t=>by[t.category]=(by[t.category]||0)+t.amount);
  const cats=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  const prevBy={};if(i>0)D.txns.filter(t=>isExp(t)&&t.date.startsWith(months[i-1])).forEach(t=>prevBy[t.category]=(prevBy[t.category]||0)+t.amount);
  const rows=sortRows(T.filter(t=>t.kind==="expense"||t.kind==="income").filter(t=>!S.cat||t.category===S.cat).filter(match));
  const sum=rows.filter(isExp).reduce((a,t)=>a+t.amount,0);

  let h=`<div class="pad">
  <div class="title"><h1>${y}年${mo}月</h1><span class="sub">予算 ${yen(b)}</span></div>
  <div class="stats">
    <div class="stat"><div class="k">支出</div><div class="v num">${yen(total)}<span class="inc ${left<0?"over":"ok"}">${left>=0?"残り":"超過"} ${yen(Math.abs(left))}</span></div></div>
    <div class="stat"><div class="k">収入</div><div class="v num ${income?"ok":""}">${income?"+"+yen(income):"—"}</div></div>
    <div class="stat"><div class="k">${perDay.k}</div><div class="v num small ${perDay.cls}">${perDay.v}</div></div>
    <div class="stat"><div class="k">前月比</div><div class="v num small ${prev!=null&&total>prev?"over":""}">${prev==null?"—":(total>=prev?"+":"−")+"¥"+Math.abs(total-prev).toLocaleString()}</div></div>
  </div>
  <div class="cols">
    <div class="group"><div class="gh"><b>カテゴリ別</b><span class="muted">選択で絞り込み</span></div>
      <table><thead><tr><th>カテゴリ</th><th class="r">金額</th><th class="r">割合</th><th class="r opt">前月</th></tr></thead><tbody>
      ${cats.map(([c,v])=>`<tr class="click ${S.cat===c?"on":""}" data-act="cat" data-c="${esc(c)}">
        <td class="${c==="未分類"?"over":""}">${esc(c)}</td><td class="r num">${num(v)}</td>
        <td class="r num muted">${total?Math.round(v/total*100):0}%</td>
        <td class="r num muted opt">${num(prevBy[c]||0)}</td></tr>`).join("")}
      <tr class="total"><td>合計</td><td class="r num">${num(total)}</td><td></td><td class="r num opt">${prev!=null?num(prev):""}</td></tr>
      </tbody></table></div>
    <div class="group"><div class="gh"><b>明細${S.cat?`（${esc(S.cat)}）`:""}</b><span class="muted num">${rows.length}件　${yen(sum)}</span></div>
      ${txTable(rows)}</div>
  </div></div>`;
  return {html:h,status:[`${rows.length} 個の項目`,`合計 ${yen(sum)}`]};
}

function chart(){
  const W=Math.max(360,months.length*56),H=170,top=12,bot=22,ch=H-top-bot;
  const max=Math.max(...months.map(m=>Math.max(mTotal[m]||0,budget(m))))*1.08||1;
  const bw=Math.min(30,W/months.length*.55);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="月別の支出"><defs>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#3f7fc9"/><stop offset=".45" stop-color="#77aee6"/><stop offset="1" stop-color="#2f69b0"/></linearGradient>
    <linearGradient id="gr" x1="0" x2="1"><stop offset="0" stop-color="#c0504d"/><stop offset=".45" stop-color="#e58a87"/><stop offset="1" stop-color="#a8403d"/></linearGradient></defs>`;
  for(let k=0;k<=4;k++){const yv=top+ch*k/4;s+=`<line x1="0" x2="${W}" y1="${yv}" y2="${yv}" stroke="#eceff3"/>`}
  months.forEach((m,i)=>{
    const cx=(i+.5)*W/months.length, v=mTotal[m]||0, h=v/max*ch, b=budget(m), by=top+ch-b/max*ch;
    s+=`<g data-act="month" data-m="${m}" style="cursor:pointer"><title>${mLabel(m)} ${yen(v)} / 予算 ${yen(b)}</title>
      <rect x="${cx-bw/2-6}" y="${top}" width="${bw+12}" height="${ch}" fill="transparent"/>
      <rect x="${cx-bw/2}" y="${top+ch-h}" width="${bw}" height="${h}" fill="url(#${v>b?"gr":"g"})" stroke="${v>b?"#8c3330":"#285c99"}" stroke-width=".8"/>
      <line x1="${cx-bw/2-5}" x2="${cx+bw/2+5}" y1="${by}" y2="${by}" stroke="#1e1e1e" stroke-width="1.2" stroke-dasharray="3 2"/>
      <text x="${cx}" y="${H-6}" text-anchor="middle" font-size="11" fill="#3c4a5c">${mLabel(m)}</text></g>`;
  });
  return s+`</svg>`;
}

function dialog({title,body="",fields=[],ok=null,cancel="閉じる",run={}}){
  return new Promise(res=>{
    closeMenu();
    const back=document.createElement("div");back.className="dlg-back";
    const f=fields.map((x,i)=>`<label for="f${i}">${esc(x.label)}</label><select id="f${i}">${x.options.map(([v,l])=>`<option value="${esc(v)}" ${String(v)===String(x.value)?"selected":""}>${esc(l)}</option>`).join("")}</select>`).join("");
    back.innerHTML=`<div class="dlg" role="dialog" aria-modal="true"><div class="tb"><span>${esc(title)}</span><button class="x" data-x="1" aria-label="閉じる">✕</button></div>
      <div class="bd">${body?`<div class="full">${body}</div>`:""}${f}</div>
      <div class="ft">${ok?`<button class="btn def" data-ok="1">${esc(ok)}</button>`:""}<button class="btn" data-x="1">${esc(cancel)}</button></div></div>`;
    document.body.appendChild(back);
    const done=v=>{back.remove();document.removeEventListener("keydown",key,true);res(v)};
    const vals=()=>Object.fromEntries(fields.map((x,i)=>[x.k,back.querySelector("#f"+i).value]));
    const key=e=>{if(e.key==="Escape"){e.stopPropagation();done(null)}if(e.key==="Enter"&&ok){e.preventDefault();e.stopPropagation();done(vals())}};
    document.addEventListener("keydown",key,true);
    back.addEventListener("click",e=>{if(e.target.dataset.x||e.target===back)return done(null);if(e.target.dataset.ok)return done(vals());
      const r=e.target.closest("[data-run]");if(r&&run[r.dataset.run]){done(null);run[r.dataset.run]()}});
    (back.querySelector("select")||back.querySelector(".btn"))?.focus();
  });
}

      ${inp("memo","内容",sel.memo)}${inp("category","カテゴリ",sel.category,{options:CATOPTS(sel.category)})}${inp("count","点数",sel.count??"",{num:1})}
      ${inp("payment","決済",sel.payment,{list:pays()})}${inp("amount","金額",amtOf(sel),{num:1,hint:sel.kind==="income"?"収入は符号なしで入力":""})}</div>
      <div class="muted small" style="margin-top:8px">保存先: csv/${esc(sel.file)} ${sel.line}行目</div>
      <div class="bar"><button class="btn def" data-act="esave">保存</button><button class="btn" data-act="edel">この行を削除</button></div></div></div>`;
  else form=`<div class="panel"><div class="ph">取引の修正（${esc(sel.payment)} の明細）</div><div class="pb"><div class="form">
      ${inp("date","日付",sel.date,{ro:1})}${inp("time","時刻",sel.time,{type:"time"})}${inp("place","場所",sel.place,{list:places()})}
      ${inp("memo","内容",sel.memo)}${inp("category","カテゴリ",sel.category,{options:CATOPTS(sel.category)})}${inp("count","点数",sel.count??"",{num:1})}
      ${inp("amount","負担額",sel.amount,{num:1,hint:"割り勘のときだけ自分の負担分に変更"})}</div>
      <div class="muted small" style="margin-top:8px">明細上の表記: ${esc(sel.raw)}${sel.note?`<br>備考: ${esc(sel.note)}`:""}<br>保存先: notes.csv（取引ID ${sel.id}）</div>
      <div class="bar"><button class="btn def" data-act="esave">保存</button>
        ${sel.merchant?`<button class="btn" data-act="erulefrom">この店に常に適用</button>`:""}
        <button class="btn" data-act="eclear">補足を消去</button></div></div></div>`;
  return {html:`<div class="pad"><div class="title"><h1>取引の修正</h1><span class="sub">明細の行は notes.csv、手入力の行は元のCSVに保存</span></div>
    <div class="ecols"><div class="group">${list}</div><div>${form}</div></div></div>`,status:[`${rows.length} 個の項目`]};
}
async function eSave(){
  const t=byId(S.eSel);if(!t)return;
  const cur={date:t.date,time:t.time||"",place:t.place,memo:t.memo||"",category:t.category,count:t.count??"",payment:t.payment||"",amount:isStd(t)?amtOf(t):t.amount};
  const keys=isStd(t)?["date","time","place","memo","category","count","payment","amount"]:["time","place","memo","category","count","amount"];
  const f={};keys.forEach(k=>{const v=val(k);if(v!==undefined&&v!==String(cur[k]))f[k]=v});
  if(!Object.keys(f).length)return toast("変更はありません");
  if(isStd(t)){if(await api("/api/std/edit",{file:t.file,line:t.line,fields:f})){S.eSel=D.txns.find(x=>x.file===t.file&&x.line===t.line)?.id||null;draw()}}
  else if(await api("/api/note",{id:t.id,fields:f}))draw();
}
async function eDel(){
  const t=byId(S.eSel);if(!t)return;
  const ok=await dialog({title:"削除の確認",ok:"削除",cancel:"キャンセル",body:`<b>${esc(t.date)}　${esc(t.place)}　${yen(amtOf(t))}</b> を csv/${esc(t.file)} から削除します。<br><span class="muted">直前の版は .history/ に保存されます。</span>`});
  if(ok&&await api("/api/std/delete",{file:t.file,line:t.line,expect:{date:t.date,amount:t.amount}})){S.eSel=null;draw()}
}
async function eClear(){
  const t=byId(S.eSel);if(!t)return;
  if(await api("/api/note",{id:t.id,fields:{time:"",category:"",place:"",memo:"",count:"",amount:""}}))draw();
}
async function eRuleFrom(){
  const t=byId(S.eSel);if(!t||!t.merchant)return;
  const c=val("category"),pl=val("place");
  if(c==="未分類")return toast("カテゴリを選んでください",true);
  const ok=await dialog({title:"店舗ルールの追加",ok:"追加",cancel:"キャンセル",body:`明細上の店名が「<b>${esc(t.merchant)}</b>」の取引を、今後すべて<br>場所「${esc(pl)}」・カテゴリ「${esc(c)}」にします（rules.toml）。`});
  if(ok&&await api("/api/rule",{merchant:t.merchant,category:c,place:pl}))draw();
}
function eAdd(){
  const now=new Date(),cur=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;
  const today=`${cur}-${String(now.getDate()).padStart(2,"0")}`;
  const recent=D.txns.filter(t=>t.file==="手入力.csv").sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)).slice(0,20);
  return {html:`<div class="pad"><div class="title"><h1>手入力の追加</h1><span class="sub">明細に無い支出（現金・その他）を csv/手入力.csv に追加</span></div>
    <div class="ecols"><div class="group"><div class="gh"><b>最近の手入力</b><span class="muted">選択すると修正画面へ</span></div>
      <div class="elist"><table><thead><tr><th>日付</th><th>場所</th><th>カテゴリ</th><th>決済</th><th class="r">金額</th></tr></thead><tbody>
      ${recent.map(t=>`<tr class="click" data-act="ejump" data-id="${t.id}"><td class="num">${t.date}</td><td class="place">${esc(t.place)}</td><td>${esc(t.category)}</td><td class="muted">${esc(t.payment)}</td><td class="r num">${yen(amtOf(t))}</td></tr>`).join("")||`<tr><td colspan="5" class="empty">まだありません</td></tr>`}
      </tbody></table></div></div>
    <div><div class="panel"><div class="ph">新しい取引</div><div class="pb"><div class="form">
      ${inp("date","日付",today,{type:"date"})}${inp("time","時刻","",{type:"time"})}${inp("category","カテゴリ","食費",{options:CATOPTS("")})}
      ${inp("place","場所","",{list:places()})}${inp("memo","内容","")}${inp("count","点数","",{num:1})}
      ${inp("payment","決済","",{list:pays(),ph:"現金 / PayPay / ICOCA …"})}${inp("amount","金額","",{num:1,hint:"収入も符号なしで入力"})}</div>
      <div class="bar"><button class="btn def" data-act="eadd">追加</button></div></div></div></div></div></div>`,status:[`手入力 ${D.txns.filter(t=>t.file==="手入力.csv").length}件`]};
}
async function eAddSave(){
  const f={};["date","time","category","place","memo","count","payment","amount"].forEach(k=>f[k]=val(k));
  if(await api("/api/std/add",{fields:f})){draw();toast("追加しました（csv/手入力.csv）")}
}
function eRule(){
  const by=new Map();
  D.txns.filter(t=>t.merchant&&(t.kind==="expense"||t.kind==="income")).forEach(t=>{
    const g=by.get(t.merchant)||{m:t.merchant,n:0,sum:0,places:{},cats:{}};
    g.n++;g.sum+=t.amount;g.places[t.place]=(g.places[t.place]||0)+1;g.cats[t.category]=(g.cats[t.category]||0)+1;by.set(t.merchant,g)});
  const top=o=>Object.entries(o).sort((a,b)=>b[1]-a[1])[0]?.[0]||"";
  const q=S.q.trim().toLowerCase();
  const rows=[...by.values()].filter(g=>!q||(g.m+" "+top(g.places)).toLowerCase().includes(q)).sort((a,b)=>b.n-a.n);
  const sel=by.get(S.eRule);
  return {html:`<div class="pad"><div class="title"><h1>店舗ルール</h1><span class="sub">明細上の店名ごとに、表示名とカテゴリを決める（rules.toml）</span></div>
    <div class="ecols"><div class="group"><div class="elist"><table><thead><tr><th>明細上の店名</th><th>表示名</th><th>カテゴリ</th><th class="r">件数</th><th class="r opt">合計</th></tr></thead><tbody>
      ${rows.map(g=>`<tr class="click ${g.m===S.eRule?"on":""}" data-act="erulesel" data-m="${esc(g.m)}"><td class="place">${esc(g.m)}</td><td class="place">${esc(top(g.places))}</td>
        <td class="${top(g.cats)==="未分類"?"over":""}">${esc(top(g.cats))}</td><td class="r num">${g.n}</td><td class="r num opt">${num(g.sum)}</td></tr>`).join("")}
      </tbody></table></div></div>
    <div><div class="panel"><div class="ph">ルール</div><div class="pb">${sel?`<div class="form">
      ${inp("merchant","明細上の店名",sel.m,{ro:1})}${inp("place","表示名",top(sel.places),{list:places()})}${inp("category","カテゴリ",top(sel.cats),{options:CATOPTS(top(sel.cats))})}</div>
      <div class="muted small" style="margin-top:8px">${sel.n}件に適用されます。個別に修正した取引（notes.csv）はそちらが優先です。</div>
      <div class="bar"><button class="btn def" data-act="erulesave">保存</button></div>`:`<span class="muted">左の一覧から店名を選択してください。検索欄で絞り込めます。</span>`}</div></div></div></div></div>`,status:[`${rows.length} 店舗`]};
}
async function eRuleSave(){
  const c=val("category");if(c==="未分類")return toast("カテゴリを選んでください",true);
  if(await api("/api/rule",{merchant:S.eRule,category:c,place:val("place")}))draw();
}
function eBudget(){
  const last=months.at(-1),d=new Date(+last.slice(0,4),+last.slice(5),1);
  const next=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
  const ms=[...months,next].reverse();
  return {html:`<div class="pad"><div class="title"><h1>予算</h1><span class="sub">空欄の月は既定の予算を使う（config.toml）</span></div>
    <div class="panel" style="max-width:520px"><div class="ph">月別の予算</div><div class="pb">
      <div class="form" style="margin-bottom:12px"><label for="b_default">既定の予算</label><input id="b_default" class="bud" inputmode="numeric" value="${D.budget.default??""}"></div>
      <table><thead><tr><th>月</th><th class="r">支出</th><th class="r">予算</th></tr></thead><tbody>
      ${ms.map(m=>`<tr><td>${m.slice(0,4)}年${mLabel(m)}</td><td class="r num ${(mTotal[m]||0)>budget(m)?"over":""}">${num(mTotal[m]||0)}</td>
        <td class="r"><input class="bud" data-m="${m}" inputmode="numeric" value="${D.budget[m]??""}" placeholder="${num(D.budget.default)}"></td></tr>`).join("")}
      </tbody></table><div class="bar"><button class="btn def" data-act="ebudsave">保存</button></div></div></div></div>`,status:[`既定 ${yen(D.budget.default||0)}`]};
}
async function eBudSave(){
  const b={};const dv=$("b_default").value.replace(/,/g,"").trim();
  if(dv!==String(D.budget.default??""))b.default=dv;
  document.querySelectorAll("input.bud[data-m]").forEach(el=>{const v=el.value.replace(/,/g,"").trim();if(v!==String(D.budget[el.dataset.m]??""))b[el.dataset.m]=v});
  if(!Object.keys(b).length)return toast("変更はありません");
  if(await api("/api/budget",{budgets:b}))draw();
}
function ePublish(){
  return {html:`<div class="pad"><div class="title"><h1>スマホ版の更新</h1></div>
    <div class="panel" style="max-width:560px"><div class="ph">GitHub Pages（暗号化して公開）</div><div class="pb">
      現在のデータで閲覧専用ページを作り直し、GitHub に送ります。URL（鍵）は変わりません。反映まで1〜2分かかります。
      <div class="muted small" style="margin-top:6px">データ生成日時 ${esc(D.generated)}</div>
      <div class="bar"><button class="btn def" data-act="epub">更新する</button></div></div></div></div>`,status:[""]};
}

// ---- イベント
document.addEventListener("click",e=>{
  if(menuEl&&!e.target.closest(".ctx")){closeMenu();if(!e.target.closest("tr.tx"))return}
  if(e.target.closest(".ctx,.dlg-back"))return;
  const row=e.target.closest("tr.tx");
  if(row){const t=byId(row.dataset.id);if(!t)return;
    if(narrow())return txMenu(t,0,0);
    S.selId=t.id;document.querySelectorAll("tr.tx.on").forEach(r=>r.classList.remove("on"));row.classList.add("on");return}
  const a=e.target.closest("[data-act]");
  if(!a){if(e.target.id==="shade")drawer(false);return}
  const act=a.dataset.act;
  if(act==="drawer"){drawer(!$("side").classList.contains("open"));return}
  if(act==="settings")return settings();
  if(act==="esec"){S.es=a.dataset.v;S.eRule=null;drawer(false);draw();$("main").scrollTop=0;return}
  if(act==="esel"){S.eSel=a.dataset.id;draw();return}
  if(act==="ejump"){const t=byId(a.dataset.id);if(t){S.es="tx";S.em=t.date.slice(0,7);S.eSel=t.id;draw()}return}
  if(act==="erulesel"){S.eRule=a.dataset.m;draw();return}
  if(EDIT){const fn={esave:eSave,edel:eDel,eclear:eClear,erulefrom:eRuleFrom,eadd:eAddSave,erulesave:eRuleSave,ebudsave:eBudSave,
    epub:async()=>{if(await api("/api/publish",{}))draw()}}[act];if(fn)return fn()}
  if(act==="view"){S.view=a.dataset.v;S.cat=null}
  else if(act==="month"){if(!a.dataset.m)return;S.view="month";S.month=a.dataset.m;S.cat=null}
  else if(act==="cat"){S.cat=a.dataset.c&&S.cat!==a.dataset.c?a.dataset.c:null}
  else if(act==="sort"){const k=a.dataset.k;S.sort=S.sort.k===k?{k,d:-S.sort.d}:{k,d:k==="amount"||k==="date"?-1:1}}
  drawer(false);draw();
  if(act!=="sort"&&act!=="cat")$("main").scrollTop=0;
});
document.addEventListener("contextmenu",e=>{
  const row=e.target.closest("tr.tx");
  if(!row){closeMenu();return}
  e.preventDefault();const t=byId(row.dataset.id);if(t)txMenu(t,e.clientX,e.clientY);
});
document.addEventListener("dblclick",e=>{const row=e.target.closest("tr.tx");if(!row||narrow())return;const t=byId(row.dataset.id);if(t)props(t)});
$("main").addEventListener("scroll",closeMenu);
$("q").addEventListener("input",e=>{S.q=e.target.value;draw()});
document.addEventListener("change",e=>{
  const c=e.target.dataset?.chg;if(!c)return;
  if(c==="em"){S.em=e.target.value;S.eSel=null}
  if(c==="eunk")S.eUnk=e.target.checked;
  draw();
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){closeMenu();return}
  if(e.target.closest?.("input,select,textarea")||document.querySelector(".dlg-back"))return;
  const i=months.indexOf(S.month);
  if(S.view==="month"&&e.key==="ArrowLeft"&&i>0){S.month=months[i-1];S.cat=null;draw()}
  if(S.view==="month"&&e.key==="ArrowRight"&&i<months.length-1){S.month=months[i+1];S.cat=null;draw()}
  if(e.key==="/"){e.preventDefault();$("q").focus()}
  if(e.key==="Enter"&&S.selId){const t=byId(S.selId);if(t)props(t)}
});
draw();
}
(async()=>{
  if(BOOT)return start(BOOT);
  const say=t=>{document.getElementById("main").innerHTML=`<div class="pad"><div class="empty">${t}</div></div>`};
  const k=new URLSearchParams(location.hash.slice(1)).get("k");
  if(!ENC||!k)return say("このページを見るには鍵の入ったURLが必要です");
  const b64=s=>{s=s.replace(/-/g,"+").replace(/_/g,"/");s+="=".repeat((4-s.length%4)%4);return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
  try{
    const key=await crypto.subtle.importKey("raw",b64(k),"AES-GCM",false,["decrypt"]);
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(ENC.iv)},key,b64(ENC.ct));
    start(JSON.parse(new TextDecoder().decode(pt)));
  }catch(e){say("鍵が違うか、データが壊れています")}
})();
</script>
